<title>Zeno Financeiro</title>

<style>

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;

        /* IMAGEM DE FUNDO */
        background-image: url("imagens/tela-principal.png");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;

        /* Cor de segurança */
        background-color: #f4f7fb;

        color: #1e293b;
        min-height: 100vh;
    }

    header {
        background: rgba(17, 24, 39, 0.95);
        color: white;
        text-align: center;
        padding: 35px 20px;
    }

    header h1 {
        font-size: 32px;
        margin-bottom: 8px;
    }

    header p {
        color: #cbd5e1;
    }

    .container {
        max-width: 1100px;
        margin: 40px auto;
        padding: 0 20px;
    }

    .titulo {
        text-align: center;
        margin-bottom: 35px;

        background: rgba(255, 255, 255, 0.92);
        padding: 25px;
        border-radius: 18px;
    }

    .titulo h2 {
        font-size: 28px;
        margin-bottom: 10px;
    }

    .titulo p {
        color: #64748b;
    }

    .planos {
        display: grid;

        grid-template-columns: repeat(
            auto-fit,
            minmax(250px, 1fr)
        );

        gap: 25px;
    }

    .plano {
        background: rgba(255, 255, 255, 0.96);

        border-radius: 18px;

        padding: 30px;

        text-align: center;

        box-shadow:
            0 10px 30px
            rgba(0, 0, 0, 0.15);

        transition:
            transform 0.2s ease,
            box-shadow 0.2s ease;
    }

    .plano:hover {
        transform: translateY(-5px);

        box-shadow:
            0 15px 35px
            rgba(0, 0, 0, 0.20);
    }

    .plano h3 {
        font-size: 22px;
        margin-bottom: 15px;
    }

    .preco {
        font-size: 32px;
        font-weight: bold;

        color: #16a34a;

        margin-bottom: 25px;
    }

    .buy-button {
        width: 100%;

        border: none;

        border-radius: 10px;

        padding: 14px;

        background: #111827;

        color: white;

        font-size: 16px;

        font-weight: bold;

        cursor: pointer;

        transition:
            background 0.2s ease,
            transform 0.2s ease;
    }

    .buy-button:hover {
        background: #374151;

        transform: translateY(-2px);
    }

    .buy-button:active {
        transform: translateY(0);
    }

    footer {
        text-align: center;

        color: white;

        padding: 30px;

        margin-top: 30px;

        background: rgba(17, 24, 39, 0.90);
    }

    @media (max-width: 600px) {

        header h1 {
            font-size: 26px;
        }

        .container {
            margin-top: 25px;
            padding: 0 12px;
        }

        .titulo {
            padding: 20px;
        }

        .plano {
            padding: 25px 20px;
        }

        .preco {
            font-size: 28px;
        }

    }

</style>
```

</head>

<script>

    // ==========================================
    // BOTÕES DE COMPRA
    // ==========================================

    const botoesCompra =
        document.querySelectorAll(
            ".buy-button"
        );


    botoesCompra.forEach(
        function (botao) {

            botao.addEventListener(
                "click",
                function () {

                    // Pega o plano clicado
                    const plano =
                        botao.getAttribute(
                            "data-plan"
                        );


                    // Pega o preço do plano clicado
                    const preco =
                        botao.getAttribute(
                            "data-price"
                        );


                    // Salva o plano
                    localStorage.setItem(
                        "planoZeno",
                        plano
                    );


                    // Salva o preço
                    localStorage.setItem(
                        "precoZeno",
                        preco
                    );


                    // Vai para o pagamento
                    window.location.href =
                        "pagamento.html";

                }
            );

        }
    );

</script>
