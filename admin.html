```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Painel Administrativo | Zeno</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f1f5f9;
            color: #172033;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            background: #111827;
            color: white;
            padding: 25px 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 3px 15px rgba(0,0,0,.15);
        }

        header h1 {
            font-size: 25px;
        }

        header span {
            color: #94a3b8;
            font-size: 14px;
        }

        /* =========================
           CONTAINER
        ========================= */

        .container {
            max-width: 1200px;
            margin: 35px auto;
            padding: 0 20px;
        }

        /* =========================
           CARDS
        ========================= */

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 22px;
            box-shadow: 0 5px 20px rgba(0,0,0,.07);
        }

        .card-label {
            color: #64748b;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .card-value {
            font-size: 28px;
            font-weight: bold;
        }

        /* =========================
           PAINEL
        ========================= */

        .painel {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,.07);
        }

        .painel-topo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .painel h2 {
            font-size: 21px;
        }

        #busca {
            width: 280px;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
        }

        /* =========================
           TABELA
        ========================= */

        .tabela {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        th {
            background: #f8fafc;
            color: #64748b;
            font-size: 13px;
            text-align: left;
            padding: 14px;
        }

        td {
            padding: 15px 14px;
            border-top: 1px solid #e5e7eb;
            font-size: 14px;
        }

        /* =========================
           STATUS
        ========================= */

        .status {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .aguardando {
            background: #fef3c7;
            color: #92400e;
        }

        .pago {
            background: #dcfce7;
            color: #166534;
        }

        .licenca {
            background: #dbeafe;
            color: #1e40af;
        }

        /* =========================
           BOTÕES
        ========================= */

        .btn {
            border: none;
            border-radius: 7px;
            padding: 9px 12px;
            cursor: pointer;
            font-weight: bold;
            margin: 2px;
        }

        .btn-pago {
            background: #16a34a;
            color: white;
        }

        .btn-licenca {
            background: #2563eb;
            color: white;
        }

        .btn-copiar {
            background: #e2e8f0;
            color: #172033;
        }

        .btn:hover {
            opacity: .9;
        }

        /* =========================
           LICENÇA
        ========================= */

        .licenca-gerada {
            margin-top: 25px;
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 12px;
            padding: 20px;
            display: none;
        }

        .licenca-gerada h3 {
            margin-bottom: 10px;
        }

        #chaveGerada {
            font-size: 20px;
            font-weight: bold;
            color: #2563eb;
            letter-spacing: 1px;
            word-break: break-all;
        }

        /* =========================
           RESPONSIVO
        ========================= */

        @media (max-width: 900px) {

            .cards {
                grid-template-columns: repeat(2, 1fr);
            }

            .painel-topo {
                flex-direction: column;
                align-items: stretch;
            }

            #busca {
                width: 100%;
            }

        }

        @media (max-width: 550px) {

            header {
                padding: 20px;
            }

            .cards {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<header>

    <div>

        <h1>
            ZENO FINANCEIRO
        </h1>

        <span>
            Painel Administrativo
        </span>

    </div>

</header>


<div class="container">


    <!-- =========================
         RESUMO
    ========================= -->

    <div class="cards">


        <div class="card">

            <div class="card-label">
                Total de pedidos
            </div>

            <div
                class="card-value"
                id="totalPedidos">

                0

            </div>

        </div>


        <div class="card">

            <div class="card-label">
                Aguardando pagamento
            </div>

            <div
                class="card-value"
                id="aguardando">

                0

            </div>

        </div>


        <div class="card">

            <div class="card-label">
                Pagamentos confirmados
            </div>

            <div
                class="card-value"
                id="pagos">

                0

            </div>

        </div>


        <div class="card">

            <div class="card-label">
                Licenças geradas
            </div>

            <div
                class="card-value"
                id="licencas">

                0

            </div>

        </div>

    </div>


    <!-- =========================
         PEDIDOS
    ========================= -->

    <div class="painel">


        <div class="painel-topo">

            <h2>
                Pedidos
            </h2>

            <input
                type="text"
                id="busca"
                placeholder="🔎 Buscar pedido, nome ou e-mail">

        </div>


        <div class="tabela">

            <table>

                <thead>

                    <tr>

                        <th>
                            Pedido
                        </th>

                        <th>
                            Cliente
                        </th>

                        <th>
                            Plano
                        </th>

                        <th>
                            Valor
                        </th>

                        <th>
                            Status
                        </th>

                        <th>
                            Licença
                        </th>

                        <th>
                            Ações
                        </th>

                    </tr>

                </thead>


                <tbody id="tabelaPedidos">

                </tbody>

            </table>

        </div>


        <!-- LICENÇA -->

        <div
            class="licenca-gerada"
            id="licencaGerada">

            <h3>
                🔑 Licença gerada
            </h3>

            <div id="chaveGerada">
                -
            </div>

            <button
                class="btn btn-copiar"
                onclick="copiarLicenca()">

                📋 Copiar licença

            </button>

        </div>


    </div>

</div>



<script>


    // ==========================================
    // PEDIDOS DE TESTE
    // ==========================================

    let pedidos = [

        {
            pedido: "ZENO-20260828-1001",
            nome: "Cliente Teste",
            email: "cliente@email.com",
            plano: "Mensal",
            valor: "R$ 19,90",
            status: "Aguardando",
            licenca: ""
        }

    ];



    // ==========================================
    // MOSTRAR PEDIDOS
    // ==========================================

    function mostrarPedidos(lista = pedidos) {

        const tabela =
            document.getElementById(
                "tabelaPedidos"
            );


        tabela.innerHTML = "";


        lista.forEach(function(pedido, indice) {


            let statusClasse =
                "aguardando";


            if (pedido.status === "Pago") {

                statusClasse =
                    "pago";

            }


            let licencaHTML =
                pedido.licenca
                ? '<span class="status licenca">Gerada</span>'
                : '<span>—</span>';



            const linha =
                document.createElement("tr");


            linha.innerHTML = `

                <td>
                    <strong>
                        ${pedido.pedido}
                    </strong>
                </td>

                <td>
                    ${pedido.nome}<br>
                    <small>${pedido.email}</small>
                </td>

                <td>
                    ${pedido.plano}
                </td>

                <td>
                    ${pedido.valor}
                </td>

                <td>
                    <span class="status ${statusClasse}">
                        ${pedido.status}
                    </span>
                </td>

                <td>
                    ${licencaHTML}
                </td>

                <td>

                    ${
                        pedido.status !== "Pago"
                        ?

                        `<button
                            class="btn btn-pago"
                            onclick="marcarPago(${indice})">

                            ✓ Pago

                        </button>`

                        :

                        ""
                    }


                    ${
                        !pedido.licenca
                        ?

                        `<button
                            class="btn btn-licenca"
                            onclick="gerarLicenca(${indice})">

                            🔑 Gerar

                        </button>`

                        :

                        `<button
                            class="btn btn-copiar"
                            onclick="copiarTexto('${pedido.licenca}')">

                            📋 Copiar

                        </button>`
                    }

                </td>

            `;


            tabela.appendChild(linha);

        });


        atualizarResumo();

    }



    // ==========================================
    // MARCAR COMO PAGO
    // ==========================================

    function marcarPago(indice) {

        pedidos[indice].status =
            "Pago";


        mostrarPedidos();


        alert(
            "Pagamento marcado como confirmado."
        );

    }



    // ==========================================
    // GERAR LICENÇA
    // ==========================================

    function gerarLicenca(indice) {

        if (
            pedidos[indice].status !== "Pago"
        ) {

            alert(
                "Confirme o pagamento antes de gerar a licença."
            );

            return;

        }


        const chave =
            gerarChave();


        pedidos[indice].licenca =
            chave;


        mostrarPedidos();


        document
            .getElementById("licencaGerada")
            .style.display = "block";


        document
            .getElementById("chaveGerada")
            .textContent = chave;


        alert(
            "Licença gerada com sucesso!"
        );

    }



    // ==========================================
    // GERAR CHAVE
    // ==========================================

    function gerarChave() {

        const caracteres =
            "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";


        function bloco() {

            let resultado = "";

            for (
                let i = 0;
                i < 4;
                i++
            ) {

                resultado +=
                    caracteres.charAt(
                        Math.floor(
                            Math.random() *
                            caracteres.length
                        )
                    );

            }

            return resultado;

        }


        return (
            "ZENO-" +
            bloco() +
            "-" +
            bloco() +
            "-" +
            bloco() +
            "-" +
            bloco()
        );

    }



    // ==========================================
    // COPIAR LICENÇA
    // ==========================================

    function copiarLicenca() {

        const chave =
            document
            .getElementById("chaveGerada")
            .textContent;


        copiarTexto(chave);

    }



    function copiarTexto(texto) {

        navigator.clipboard
            .writeText(texto)
            .then(function() {

                alert(
                    "✅ Copiado!"
                );

            });

    }



    // ==========================================
    // RESUMO
    // ==========================================

    function atualizarResumo() {

        document
            .getElementById("totalPedidos")
            .textContent =
            pedidos.length;


        document
            .getElementById("aguardando")
            .textContent =
            pedidos.filter(
                p => p.status === "Aguardando"
            ).length;


        document
            .getElementById("pagos")
            .textContent =
            pedidos.filter(
                p => p.status === "Pago"
            ).length;


        document
            .getElementById("licencas")
            .textContent =
            pedidos.filter(
                p => p.licenca !== ""
            ).length;

    }



    // ==========================================
    // BUSCA
    // ==========================================

    document
        .getElementById("busca")
        .addEventListener(
            "input",
            function() {


                const texto =
                    this.value
                    .toLowerCase();


                const filtrados =
                    pedidos.filter(
                        function(pedido) {

                            return (

                                pedido.pedido
                                    .toLowerCase()
                                    .includes(texto)

                                ||

                                pedido.nome
                                    .toLowerCase()
                                    .includes(texto)

                                ||

                                pedido.email
                                    .toLowerCase()
                                    .includes(texto)

                            );

                        }
                    );


                mostrarPedidos(
                    filtrados
                );

            }
        );



    // ==========================================
    // INICIAR
    // ==========================================

    mostrarPedidos();


</script>


</body>

</html>
